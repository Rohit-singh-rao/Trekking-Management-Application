{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">Edit Trek</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Trek Name</label>
                            <input type="text" name="trek_name" class="form-control" value="{{ trek.trek_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Difficulty</label>
                            <select name="difficulty" class="form-select" required>
                                <option value="Easy"
                                {% if trek.difficulty == "Easy" %}selected{% endif %}>
                                    Easy
                                </option>
                                <option value="Moderate"
                                {% if trek.difficulty == "Moderate" %}selected{% endif %}>
                                    Moderate
                                </option>
                                <option value="Hard"
                                {% if trek.difficulty == "Hard" %}selected{% endif %}>
                                    Hard
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Duration (Days)</label>
                            <input type="number" name="duration" class="form-control" value="{{ trek.duration }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"> Price</label>
                            <input type="number" name="price" class="form-control" value="{{ trek.price }}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label"> Available Slots </label>
                            <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success px-4">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
