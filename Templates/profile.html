{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">👤 My Profile</h3>
                </div>
                <div class="card-body">
                    <p>
                        <strong>Name:</strong>
                        {{ user.name }}
                    </p>
                    <hr>
                    <p>
                        <strong>Email:</strong>
                        {{ user.email }}
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
